<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1628">
<title>Beyond the Protocols: Vote</title>
<link rel="stylesheet" href="btp.css">
<style>
  body { min-height: 100dvh; display: flex; flex-direction: column; }
  header.brand { padding: 0 0 14px; }
  header.brand .inner { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 18px 0; gap: 12px; }
  header.brand .session { font-size: 13px; color: var(--muted); }
  main { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; padding: 4px 16px calc(24px + env(safe-area-inset-bottom)); }

  .state { text-align: center; padding: 18vh 12px 0; }
  .state h1 { font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1.25; margin: 0 0 12px; }
  .state p { color: var(--muted); font-size: 16px; line-height: 1.5; margin: 0 auto; max-width: 30ch; }
  .pulse { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); margin: 0 auto 26px; animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .35; transform: scale(.8);} 50% { opacity: 1; transform: scale(1.15);} }

  .poll-label { margin: 6px 0 10px; }
  details.case { margin-bottom: 16px; }
  details.case summary { list-style: none; cursor: pointer; justify-content: flex-start; }
  details.case summary::-webkit-details-marker { display: none; }
  details.case summary::after { content: "Hide"; font-size: 11px; color: var(--accent-light); letter-spacing: .08em; text-transform: uppercase; margin-left: auto; }
  details.case:not([open]) summary::after { content: "Show case"; }
  details.case .patient__when { margin-left: 10px; }

  h2.question { font-family: var(--display); font-weight: 400; font-size: 23px; line-height: 1.3; margin: 0 0 6px; }
  .hint { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
  .opts { display: grid; gap: 10px; }
  .opt {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    padding: 13px 14px; min-height: 58px; border-radius: 12px; cursor: pointer;
    background: var(--card); border: 2px solid var(--border);
    font-size: 16px; line-height: 1.3; color: var(--fg-2);
    transition: border-color .15s, background .15s;
  }
  .opt .badge { background: transparent; border: 2px solid var(--accent); color: var(--accent-light); width: 32px; height: 32px; font-size: 16px; }
  .opt[aria-pressed="true"] { border-color: var(--accent); background: rgba(123,111,166,.18); color: #fff; }
  .opt[aria-pressed="true"] .badge { background: var(--accent); color: #fff; }
  .opt:disabled { cursor: default; }
  .submit {
    margin-top: 16px; width: 100%; padding: 16px; border: 0; border-radius: 12px; cursor: pointer;
    background: var(--accent); color: #fff; font-weight: 700; font-size: 17px; letter-spacing: .02em;
  }
  .submit:disabled { background: var(--card); color: var(--muted); cursor: default; }
  .done { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: rgba(34,197,94,.12); border: 1px solid rgba(34,197,94,.45); font-size: 15px; color: #d1fae5; }
  .closed-note { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: var(--card); border: 1px solid var(--border); font-size: 15px; color: var(--muted); }
  .error { margin-top: 12px; color: #fca5a5; font-size: 14px; }
</style>
</head>
<body>
<header class="brand">
  <div class="topbar"></div>
  <div class="inner"><span class="kicker">Beyond the Protocols</span><span class="session" id="session"></span></div>
</header>
<main id="app"><div class="state"><div class="pulse"></div><p>Connecting...</p></div></main>

<script type="module">
import { connect, SET, POLLS, pollById, letter, esc, patientCard, offlineBanner } from "./app.js";

document.getElementById("session").textContent = SET.title;
const app = document.getElementById("app");

let api, control = {}, poll = null, mine = null, picked = [], unsubVotes = null, busy = false, err = "", caseHidden = null;

const state = (title, body, pulse = false) =>
  `<div class="state">${pulse ? '<div class="pulse"></div>' : ""}<h1>${title}</h1><p>${body}</p></div>`;

function render() {
  if (!poll) {
    app.innerHTML = state("Eyes up front", "The next question will appear here when voting opens. Keep this page open.", true);
    return;
  }
  const open = !!control.open;
  const changed = mine ? picked.slice().sort().join(",") !== mine.slice().sort().join(",") : picked.length > 0;
  const btn = !open ? "" :
    `<button class="submit" id="submit" ${(!picked.length || !changed || busy) ? "disabled" : ""}>
      ${busy ? "Sending..." : mine ? (changed ? "Change my vote" : "Vote recorded") : "Submit vote"}</button>`;
  const caseOpen = caseHidden === null ? !mine : !caseHidden; // collapse once they've voted, unless they chose
  app.innerHTML = `
    <div class="kicker poll-label">${esc(poll.label)}</div>
    ${patientCard(poll, { collapsible: true, open: caseOpen })}
    <h2 class="question">${esc(poll.question)}</h2>
    <p class="hint">${poll.multi ? "Choose all that apply." : "Choose one."}${poll.context ? " " + esc(poll.context) : ""}</p>
    <div class="opts">${poll.options.map((o, i) => `
      <button class="opt" data-i="${i}" aria-pressed="${picked.includes(i)}" ${open ? "" : "disabled"}>
        <span class="badge">${letter(i)}</span><span>${esc(o)}</span></button>`).join("")}</div>
    ${btn}
    ${open && mine && !changed ? `<div class="done">Your vote (${mine.map(letter).join(", ")}) is in. You can change it until voting closes.</div>` : ""}
    ${!open ? `<div class="closed-note">${mine ? `Voting has closed. You voted ${mine.map(letter).join(", ")}.` : "Voting has closed for this question."}</div>` : ""}
    ${err ? `<div class="error">${esc(err)}</div>` : ""}`;
  const d = app.querySelector("details.case");
  if (d) d.addEventListener("toggle", () => { caseHidden = !d.open; });
  app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    const i = +b.dataset.i;
    if (poll.multi) picked = picked.includes(i) ? picked.filter(x => x !== i) : [...picked, i];
    else picked = [i];
    err = "";
    render();
  }));
  const s = document.getElementById("submit");
  if (s) s.addEventListener("click", submit);
}

async function submit() {
  if (!poll || !picked.length || busy) return;
  const target = poll.id;
  busy = true; err = ""; render();
  const send = () => api.vote(target, picked.slice().sort((a, b) => a - b));
  try {
    try { await send(); }
    catch (e) { await new Promise(r => setTimeout(r, 800)); await send(); } // one quiet retry
  } catch (e) {
    const moved = control.poll !== target;
    err = moved ? "Voting has moved on to the next question."
      : !control.open ? "Voting closed before your vote arrived."
      : `That didn't go through. Try again in a moment. (${e && (e.code || e.message) || "unknown"})`;
  }
  busy = false; render();
}

function setPoll(id) {
  const next = pollById(id);
  if ((next && next.id) === (poll && poll.id)) return;
  if (unsubVotes) { unsubVotes(); unsubVotes = null; }
  poll = next; mine = null; picked = []; err = ""; caseHidden = null;
  if (poll) {
    unsubVotes = api.onVotes(poll.id, votes => {
      const uid = api.user() && api.user().uid;
      const v = uid && votes[uid];
      const had = mine;
      mine = v ? String(v.c).split(",").map(Number) : null;
      if (mine && !had && !busy) picked = mine.slice();
      render();
    });
  }
  render();
}

(async () => {
  try {
    api = await connect({ anonymous: true });
  } catch (e) {
    app.innerHTML = state("Can't connect", "Check your phone has internet access (mobile data works best), then reload this page.");
    return;
  }
  offlineBanner(api);
  api.onControl(c => {
    control = c;
    setPoll(c.poll && POLLS.some(p => p.id === c.poll) ? c.poll : null);
    render();
  });
})();
</script>
</body>
</html>
