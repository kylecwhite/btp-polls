<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beyond the Protocols: Results</title>
<link rel="stylesheet" href="btp.css">
<script src="qrcode.js"></script>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  /* Sized for a box on a slide: everything scales with --u, which fit() sets
     from the frame size and shrinks until the content fits. */
  :root { --u: 1vw; }
  html, body { height: 100%; overflow: hidden; background: var(--surface); }
  body { display: grid; grid-template-rows: minmax(0, 1fr) auto; padding: calc(var(--u)*3.5) calc(var(--u)*4) calc(var(--u)*2.5); gap: calc(var(--u)*2); }
  main { min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-start; }
  /* Centred with auto margins, which never push overflow above the top edge (justify-content: center clipped A and E) */
  main > :first-child { margin-top: auto; } main > :last-child { margin-bottom: auto; }
  /* Question heading, so the poll needs no separate question slide */
  .q { font-family: var(--display); font-weight: 400; font-size: calc(var(--u)*4); line-height: 1.2; color: #fff; margin: 0 0 calc(var(--u)*.7); }
  .qctx { color: var(--muted); font-style: italic; font-size: calc(var(--u)*1.9); margin: 0 0 calc(var(--u)*2.2); }
  .qwrap { margin-bottom: calc(var(--u)*2.2); }
  .qwrap .qctx { margin-bottom: 0; }
  .bars { --opt-size: calc(var(--u)*3.1); --pct-size: calc(var(--u)*3.4); --bar-h: calc(var(--u)*2.1); --row-gap: calc(var(--u)*1.8); }
  .bars.short { --bar-h: calc(var(--u)*3); --row-gap: calc(var(--u)*2.4); }
  .bar-row__label { margin-bottom: calc(var(--u)*.6); }
  .bar-row { gap: calc(var(--u)*1.8); }
  .badge { width: calc(var(--u)*5); height: calc(var(--u)*5); font-size: calc(var(--u)*2.6); }
  .legend { font-size: calc(var(--u)*2.4); margin-bottom: calc(var(--u)*1.6); gap: calc(var(--u)*3); }
  .legend i { width: calc(var(--u)*4.5); height: calc(var(--u)*1.6); }
  footer { display: flex; align-items: center; gap: calc(var(--u)*3); color: var(--muted); font-size: calc(var(--u)*2.4); }
  footer b { color: #fff; font-family: var(--display); font-size: calc(var(--u)*3.6); font-weight: 700; margin-right: calc(var(--u)*.8); }
  footer .pill { font-size: calc(var(--u)*1.9); padding: calc(var(--u)*.8) calc(var(--u)*1.8); }
  footer .pill .dot { width: calc(var(--u)*1.5); height: calc(var(--u)*1.5); }
  footer .join { margin-left: auto; display: flex; align-items: center; gap: calc(var(--u)*2); }
  footer .join svg { width: calc(var(--u)*10); height: calc(var(--u)*10); background: #fff; border-radius: calc(var(--u)*1); padding: calc(var(--u)*.6); }
  .wait { display: grid; place-items: center; text-align: center; color: var(--muted); font-size: calc(var(--u)*3.4); height: 100%; }
  /* Patient card on the left, as on the question slide */
  .split { display: grid; grid-template-columns: calc(var(--u)*30) minmax(0, 1fr); gap: calc(var(--u)*4); align-items: center; }
  .split .patient { border-radius: calc(var(--u)*1.2); }
  .split .patient__head { justify-content: center; padding: calc(var(--u)*1.6) calc(var(--u)*2); }
  .split .patient__name { font-size: calc(var(--u)*2.2); }
  .split .patient__when { font-size: calc(var(--u)*1.6); }
  .split .patient__body { padding: calc(var(--u)*2) calc(var(--u)*2.4) calc(var(--u)*2.4); font-size: calc(var(--u)*2); line-height: 1.45; }
  .split .patient__body .gap { height: calc(var(--u)*1.4); }
  .split .patient__tag { display: block; text-align: center; margin-top: calc(var(--u)*2.2); padding: calc(var(--u)*1) calc(var(--u)*1.6); font-size: calc(var(--u)*1.5); border-radius: calc(var(--u)*.8); }
  .split .when { color: var(--accent-light); font-size: calc(var(--u)*1.7); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 calc(var(--u)*1); }
  /* PowerPoint add-in: small settings chip, bottom right, only while editing the deck */
  #cfg { position: fixed; right: 8px; bottom: 8px; z-index: 10; display: flex; gap: 8px; align-items: center;
         background: rgba(6,14,27,.9); border: 1px solid var(--border); border-radius: 7px; padding: 4px 6px;
         font-size: 11px; opacity: .55; transition: opacity .15s; }
  #cfg:hover, #cfg:focus-within { opacity: 1; }
  #cfg select { font: 11px var(--body); background: var(--card); color: #fff; border: 1px solid var(--border); border-radius: 5px; padding: 2px 4px; max-width: 30vw; }
  #cfg label { color: var(--muted); display: flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; }
</style>
</head>
<body>
<div id="cfg" class="hidden"><select id="pick" title="Poll shown in this box"></select><label title="Show the patient card beside the results"><input type="checkbox" id="showCase">Case</label></div>
<main id="main"><div class="wait">Connecting...</div></main>
<footer id="foot"></footer>
<script type="module">
// results.html?p=s07-p01        this poll, always (one per slide)
// results.html                  whichever poll is live
// As a PowerPoint add-in (manifest.xml) each instance remembers its own poll,
// chosen from the picker that shows while editing and hides in slide show.
// &labels=0 bars and letters only (the slide already lists the options)
// &qr=0      no join code in the footer
// &case=0    no patient card on the left
import { connect, params, pollById, tally, barsMarkup, updateBars, qrSvg, joinUrl, esc, applyAccent, patientCard, POLLS, SESSION_META } from "./app.js";

let FIXED = params.get("p");
const SHORT = params.get("labels") === "0";
const QR = params.get("qr") !== "0";
let CASE = params.get("case") !== "0";
const main = document.getElementById("main"), foot = document.getElementById("foot");
let api, control = {}, votes = {}, prevVotes = {}, subs = [], built = null, last;

const pid = () => FIXED || control.poll || null;

// Largest size that fits the frame: start from width (16:9) and shrink until nothing overflows.
// Binary search on --u so it always lands on the largest size that fits,
// and re-run whenever the frame, the fonts or the content change (PowerPoint
// can resize the box when the slide show starts without a resize event).
const overflows = () => {
  const c = main.firstElementChild;
  const h = c ? c.scrollHeight : main.scrollHeight;
  return h > main.clientHeight + 1 || main.scrollHeight > main.clientHeight + 1 ||
         document.body.scrollHeight > innerHeight + 1 || document.body.scrollWidth > innerWidth + 1;
};
let fitting = false, lastFit = "";
function fit() {
  if (fitting || !innerWidth || !innerHeight) return;
  fitting = true;
  const root = document.documentElement.style;
  let hi = Math.min(innerWidth / 100, innerHeight / 56.25), lo = hi * 0.2;
  root.setProperty("--u", hi + "px");
  if (overflows()) {
    for (let i = 0; i < 14; i++) {
      const mid = (lo + hi) / 2;
      root.setProperty("--u", mid + "px");
      if (overflows()) hi = mid; else lo = mid;
    }
    root.setProperty("--u", lo + "px");
  }
  lastFit = innerWidth + "x" + innerHeight;
  fitting = false;
}
addEventListener("resize", () => fit());
try { new ResizeObserver(() => requestAnimationFrame(fit)).observe(document.body); } catch (e) {}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fit());
document.addEventListener("visibilitychange", () => requestAnimationFrame(fit));
// Belt and braces: if the frame changed or anything overflows, fit again.
setInterval(() => { if (lastFit !== innerWidth + "x" + innerHeight || overflows()) fit(); }, 1000);

function paint() {
  const p = pollById(pid());
  const live = !!p && control.poll === p.id;
  const compare = !!(p && p.compareWith && live && control.compare);
  const key = `${p ? p.id : ""}|${compare}|${CASE}`;
  if (key !== built) {
    built = key;
    if (p) applyAccent(p.session);
    const head = p ? `<div class="qwrap"><h1 class="q">${esc(p.question)}</h1>${p.context ? `<p class="qctx">${esc(p.context)}</p>` : ""}</div>` : "";
    const results = p ? `${head}${compare ? `<div class="legend"><span class="prev"><i></i>First vote</span><span class="now"><i></i>Now</span></div>` : ""}${barsMarkup(p, { compare, short: SHORT })}` : "";
    main.innerHTML = !p ? `<div class="wait">Waiting for the next question</div>`
      : CASE && p.patient
        ? `<div class="split"><div>${p.label ? `<div class="when">${esc(p.label)}</div>` : ""}${patientCard(p)}</div><div>${results}</div></div>`
        : results;
    if (SHORT) main.querySelector(".bars")?.classList.add("short");
    requestAnimationFrame(fit);
    foot.innerHTML = `<span><b id="n">0</b><span id="nl">votes</span></span><span class="pill" id="pill"><span class="dot"></span><span id="pt"></span></span>
      ${QR ? `<span class="join">${qrSvg(joinUrl(), 220)}<span>${esc(joinUrl().replace(/^https?:\/\//, "").replace(/\/$/, ""))}</span></span>` : ""}`;
  }
  if (!p) return;
  const now = tally(votes, p.options.length);
  const prev = compare ? tally(prevVotes, p.options.length) : null;
  // A poll that isn't live any more shows its final result; the live one obeys Reveal.
  updateBars(main, now, prev, { hidden: live && !control.show });
  document.getElementById("n").textContent = now.n;
  document.getElementById("nl").textContent = now.n === 1 ? "vote" : "votes";
  const open = live && !!control.open;
  document.getElementById("pill").classList.toggle("is-open", open);
  document.getElementById("pt").textContent = open ? "Voting open" : "Closed";
}

function resub() {
  subs.forEach(u => u && u()); subs = []; votes = {}; prevVotes = {};
  const p = pollById(pid());
  if (!p) return;
  subs.push(api.onVotes(p.id, v => { votes = v; paint(); }));
  if (p.compareWith) subs.push(api.onVotes(p.compareWith, v => { prevVotes = v; paint(); }));
}

// ---------- PowerPoint add-in mode ----------
async function officeSetup() {
  if (!window.Office) return;
  const info = await Promise.race([Office.onReady(), new Promise(r => setTimeout(() => r(null), 4000))]);
  if (!info || !info.host) return;              // plain browser: nothing to do
  const settings = Office.context.document.settings;
  const saved = settings.get("poll");
  if (saved !== null && saved !== undefined) FIXED = saved || null;
  const savedCase = settings.get("case");
  if (savedCase !== null && savedCase !== undefined) CASE = savedCase !== "0";
  const cfg = document.getElementById("cfg"), pick = document.getElementById("pick"), box = document.getElementById("showCase");
  pick.innerHTML = `<option value="">Follow the live poll</option>` + POLLS.map(p =>
    `<option value="${p.id}" ${p.id === FIXED ? "selected" : ""} title="${esc(p.question)}">S${p.session} slide ${p.slide}${p.patient ? ": " + esc(p.patient.name) : ""}${p.compareWith ? " (again)" : ""}</option>`).join("");
  box.checked = CASE;
  const save = () => settings.saveAsync(() => {});
  pick.onchange = () => {
    FIXED = pick.value || null;
    settings.set("poll", pick.value); save();
    built = null;
    if (api) { last = pid(); resub(); paint(); }
  };
  box.onchange = () => {
    CASE = box.checked;
    settings.set("case", CASE ? "1" : "0"); save();
    built = null;
    if (api) paint();
  };
  const showFor = view => cfg.classList.toggle("hidden", view !== "edit");
  Office.context.document.getActiveViewAsync(r => showFor(r.value));
  try { Office.context.document.addHandlerAsync(Office.EventType.ActiveViewChanged, e => showFor(e.activeView)); } catch (e) {}
}

(async () => {
  await officeSetup();
  api = await connect();
  api.onControl(c => {
    control = c;
    if (pid() !== last) { last = pid(); resub(); }
    paint();
  });
  if (FIXED) { last = FIXED; resub(); }
})();
</script>
</body>
</html>
